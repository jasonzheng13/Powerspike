# Tech companies the stock dashboard knows about. Any ticker can be searched; this file adds a name,
# a GDELT news query (OR'd terms must sit inside parentheses) and the Polymarket contract(s) whose odds are compared with the stock at each
# spike. The FIRST contract is the one shown and scored; later ones are fallbacks for an operator.
#
# event_sign: +1 when a rising YES price is good for the stock, -1 when it is bad.
# closes: the date the contract settles (YYYY-MM-DD); a settled contract is skipped so a flat 0/100%
#   line never reads as a "trend". A contract pinned in a tail for the whole window is skipped too.
# token_id: the YES outcome's CLOB token (Gamma clobTokenIds[0]), resolved with
#   python scripts/find_markets.py --event-slug <event slug>
# Volumes in the comments are lifetime shares on 2026-10-17. Kalshi has no single-stock price
# contracts (only Nasdaq-100 ranges), so every contract here is Polymarket. A leg priced under ~1%
# (MSFT/AMZN "largest company") clips to a constant in log-odds and always reads "contract quiet";
# such legs are listed second or left out.
companies:
  - ticker: NVDA
    name: Nvidia
    sector: semis
    news_query: '("Nvidia" OR NVDA)'
    contracts:
      - id: poly:largest-company-dec-2026-nvda
        venue: polymarket
        name: Largest company by market cap, Dec 31 2026
        question: Will NVIDIA be the largest company in the world by market cap on December 31?
        token_id: "11876606915924142133615854761923277060697657209957870741155164849437788272266"  # 70%, 1.42M
        event_sign: 1
        closes: 2026-12-31
      - id: poly:nvda-close-above-210-oct-19-2026
        venue: polymarket
        name: NVDA closes above $210 on Oct 19
        question: Will NVIDIA (NVDA) close above $210 on October 19?
        token_id: "93128067651624508466874413283734134278650484526866952384911618204253408660128"  # 71%, 30 (thin)
        event_sign: 1
        closes: 2026-10-19
