# Markets Powerspike watches.
#
# event_type links a market to config/exposure.yaml (who's exposed).
# event_sign: +1 when a rising YES price means the event's odds (as defined in
# exposure.yaml) are rising, -1 when it means the opposite. Default +1.
#
# Chosen 2026-10-11 for real volume and a price that lives between 5% and 95% (the detector's tail
# gate), with releases inside the ~60 days yfinance still serves ETF bars for. The dropped Polymarket
# macro markets (tariffs, recession, Fed hold) traded a few hundred contracts a week and never fired.
#
# Polymarket: `token_id` is the CLOB token ID for the YES outcome
#   (Gamma API market -> clobTokenIds[0]), NOT the market id or slug. Search with
#   https://gamma-api.polymarket.com/public-search?q=... (the top-200-by-volume listing is all sports).
#   prices-history serves 1-minute bars in <=14-day chunks (polymarket.price_history pages).
# Kalshi: needs both `series_ticker` and `ticker`. Kalshi halts a contract shortly before the event
#   it settles on (5 min before a data release; 13:59 ET for an FOMC decision), so the release itself
#   is never in the data, only the repricing before it.
#
# Find candidates with:  python scripts/find_markets.py --kalshi KXFEDDECISION

markets:
  # ---- Kalshi ------------------------------------------------------------------------------
  # Fed decision legs: YES = "hike 25 bps", so YES up = hawkish = cut odds down -> event_sign -1.
  # The settled September leg traded 18.8M contracts through Aug CPI, Sep jobs, PPI and CPI.
  - id: kalshi-fed-sep-decision
    name: "Fed hikes 25 bps at the September 2026 meeting (Kalshi, settled)"
    venue: kalshi
    series_ticker: "KXFEDDECISION"
    ticker: "KXFEDDECISION-26SEP-H25"
    event_type: fed_rates
    event_sign: -1

  - id: kalshi-fed-oct-decision
    name: "Fed hikes 25 bps at the October 2026 meeting (Kalshi)"
    venue: kalshi
    series_ticker: "KXFEDDECISION"
    ticker: "KXFEDDECISION-26OCT-H25"
    event_type: fed_rates
    event_sign: -1

  - id: cpi-sep
    name: "September 2026 CPI rises more than 0.5% (Kalshi)"
    venue: kalshi
    series_ticker: "KXCPI"
    ticker: "KXCPI-26SEP-T0.5"
    event_type: inflation
    event_sign: 1

  - id: kalshi-cpi-yoy-sep
    name: "CPI inflation above 3.6% for the year to September 2026 (Kalshi)"
    venue: kalshi
    series_ticker: "KXCPIYOY"
    ticker: "KXCPIYOY-26SEP-T3.6"
    event_type: inflation
    event_sign: 1

  # YES = unemployment above 4.2%, so YES up = weaker labour market -> event_sign +1 under `labor`.
  - id: kalshi-unemp-aug
    name: "August 2026 unemployment rate above 4.2% (Kalshi, settled)"
    venue: kalshi
    series_ticker: "KXU3"
    ticker: "KXU3-26AUG-T4.2"
    event_type: labor
    event_sign: 1

  # Settled contracts kept for validation/known_events.yaml (Aug jobs Sep 4, PPI Sep 10, CPI Sep 11).
  - id: kalshi-fed-sep
    name: "Fed upper bound above 3.75% after the September 2026 meeting (Kalshi, settled)"
    venue: kalshi
    series_ticker: "KXFED"
    ticker: "KXFED-26SEP-T3.75"
    event_type: fed_rates
    event_sign: -1

  - id: kalshi-cpi-aug
    name: "August 2026 CPI rises more than 0.3% (Kalshi, settled)"
    venue: kalshi
    series_ticker: "KXCPI"
    ticker: "KXCPI-26AUG-T0.3"
    event_type: inflation
    event_sign: 1

  # ---- Polymarket --------------------------------------------------------------------------
  # Polymarket's liquid macro book (2026-10) is the Fed hike legs; everything else sits under 5c.
  - id: poly-fed-oct-hike
    name: "Fed raises rates 25 bps at the October 2026 meeting (Polymarket)"
    venue: polymarket
    token_id: "55159722761418013044126414276680602270318000841690689684819994448621694923050"
    event_type: fed_rates
    event_sign: -1

  - id: poly-fed-dec-hike
    name: "Fed raises rates 25 bps at the December 2026 meeting (Polymarket)"
    venue: polymarket
    token_id: "111662129652828266889360374468657435151479595863413519836161861837506140152890"
    event_type: fed_rates
    event_sign: -1

  # Listed 2026-09-16, so it has the shortest history of the set.
  - id: poly-fed-another-hike
    name: "Another Fed rate hike in 2026 (Polymarket)"
    venue: polymarket
    token_id: "834988939366537589681339435844742816680296103724655311351481456389958777625"
    event_type: fed_rates
    event_sign: -1
